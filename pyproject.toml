[project]
name = "oracle-of-trust"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "httpx==0.28.1",
  "pydantic==2.11.4", "eth-account==0.13.7", "web3==7.11.1",
  "jsonschema==4.23.0", "psycopg[binary]==3.2.9", "pytest==8.3.5", "pytest-asyncio==0.26.0"
]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["oracle*"]
